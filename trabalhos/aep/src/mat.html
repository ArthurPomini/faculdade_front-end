<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Estudos - Matemática</title>
    <link rel="stylesheet" href="mat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <header class="header">
            <div class="title-area">
                <a href="../index.html" class="btn-home-back">&larr; Voltar</a>
                <h1 class="subject-title">Matemática</h1>
            </div>
            <div class="user-stats">
                <span class="stat-item badge-rank">Rank: 1º</span>
                <span class="stat-item badge-xp">XP: 71 / 100</span>
            </div>
        </header>

        <div class="progress-section">
            <p class="progress-label">Seu progresso nesta matéria</p>
            <div class="progress-container">
                <div class="progress-bar" style="width: 67%;">
                    <span class="progress-text">67% Concluído</span>
                </div>
            </div>
        </div>

        <div class="buttons-grid">
            <button class="content-button" id="btn-aulas">
                <span class="icon">📺</span>
                Aulas
            </button>
            <button class="content-button" id="btn-exercicios">
                <span class="icon">📝</span>
                Exercícios
            </button>
        </div>

        <div id="exercicio-modal" class="modal">
            <div class="modal-content-exercicio">
                <span class="close-button" id="close-exercicio">&times;</span>
                
                <div class="question-box">
                    <span class="tag-topico">Trigonometria</span>
                    <h2>Exercício de Fixação</h2>
                    <p class="enunciado">Analisando o triângulo retângulo, com suas medidas dadas em centímetros, podemos afirmar que o valor do seno do ângulo &beta; é igual a:</p>
                    
                    <div class="img-wrapper">
                        <img src="mat.png" alt="Triângulo Retângulo" class="question-image">
                    </div>

                    <form id="quiz-form">
                        <label class="alternative">
                            <input type="radio" name="resposta" value="A">
                            <span class="letter">A</span> 3/5
                        </label>
                        <label class="alternative">
                            <input type="radio" name="resposta" value="B">
                            <span class="letter">B</span> 4/5
                        </label>
                        <label class="alternative">
                            <input type="radio" name="resposta" value="C">
                            <span class="letter">C</span> 5/4
                        </label>
                        <label class="alternative">
                            <input type="radio" name="resposta" value="D">
                            <span class="letter">D</span> 4/3
                        </label>
                        <label class="alternative">
                            <input type="radio" name="resposta" value="E">
                            <span class="letter">E</span> 3/4
                        </label>

                        <button type="button" id="btn-finalizar" class="submit-button">Enviar Resposta</button>
                    </form>

                    <div id="feedback-message" class="feedback"></div>
                </div>
            </div>
        </div>

        <div id="video-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <div class="video-container">
                    </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Gov.Br &copy; 2026</p>
    </footer>

    <script src="mat.js"></script>
</body>
</html>
